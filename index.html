/* Claims versus demonstrated skills: post evaluation heatmap */
.hm-panel{margin-top:24px;border:1px solid #d8e5f3;background:#fff;border-radius:18px;box-shadow:0 3px 14px #1e36570c;padding:24px;scroll-margin-top:22px}
.hm-header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}
.hm-kicker{font-size:11px;text-transform:uppercase;font-weight:850;letter-spacing:1.2px;color:#2779cd;margin-bottom:7px}
.hm-heading{font-size:22px;font-weight:800;letter-spacing:-.45px;margin:0;color:#183354}
.hm-intro{font-size:13px;color:#5e748e;line-height:1.6;margin:8px 0 0;max-width:820px}
.hm-rounds{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:13px}
.hm-rounds span{border:1px solid #cae2fb;border-radius:8px;background:#f0f8ff;padding:6px 10px;color:#315d8c;font-weight:700;font-size:11px}
.hm-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:21px 0 16px}
.hm-stat{border:1px solid #e0eafa;background:linear-gradient(135deg,#f9fcff,#edf6ff);padding:14px 15px;border-radius:12px}
.hm-statnum{font-weight:850;font-size:24px;letter-spacing:-.7px;color:#185da2}
.hm-statlabel{font-size:11px;color:#6a7e94;margin-top:4px;line-height:1.4}
.hm-toolbar{display:flex;align-items:end;gap:11px;flex-wrap:wrap;border-top:1px solid #e7eef6;padding-top:17px;margin-top:15px}
.hm-control{display:grid;gap:5px}.hm-control label{font-size:11px;font-weight:750;color:#526b87}
.hm-control select,.hm-control input{border:1px solid #cddded;background:#fff;color:#234463;border-radius:9px;padding:10px 10px;min-width:135px;max-width:220px;font-size:12px;height:38px}
.hm-search{flex:1;min-width:150px}.hm-search input{width:100%;max-width:none}
.hm-btn{border:1px solid #bcd7f1;background:#fff;color:#2767a5;padding:10px 14px;border-radius:9px;font-weight:750;font-size:12px;height:38px;white-space:nowrap;cursor:pointer}
.hm-btn:hover{background:#eff7ff}.hm-btn.primary{background:#287ed6;color:#fff;border-color:#287ed6}
.hm-filterrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:13px 0 16px}
.hm-filter{padding:8px 11px;border-radius:25px;border:1px solid #d9e6f5;background:#fff;color:#54708b;font-weight:700;font-size:11px}
.hm-filter.on{border-color:#79afe9;background:#eaf5ff;color:#1769bc}
.hm-filter-note{font-size:11px;color:#7890a8;margin-left:auto}
.hm-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(305px,.85fr);gap:16px;align-items:start}
.hm-main{min-width:0}
.hm-gridwrap{border:1px solid #dce8f4;border-radius:12px;overflow:auto;max-width:100%;background:#fff}
.hm-grid{min-width:830px}
.hm-line{display:grid;grid-template-columns:136px repeat(7,minmax(96px,1fr)) 98px;gap:4px;align-items:stretch;padding:4px 5px}
.hm-line.head{position:sticky;top:0;z-index:4;background:#eef5fd;padding-top:9px;padding-bottom:9px;border-bottom:1px solid #d2e3f4}
.hm-competency{text-align:center;font-size:11px;color:#284769;font-weight:800;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;line-height:1.3;padding:4px}
.hm-require{color:#3179bb;font-size:9px;font-weight:750;line-height:1.4}
.hm-line:not(.head){border-bottom:1px solid #f0f4f8}.hm-line:last-child{border-bottom:0}
.hm-person{display:flex;justify-content:center;flex-direction:column;gap:4px;padding:5px 7px;position:sticky;left:0;background:#fff;z-index:2;border-right:1px solid #eaf0f5}
.hm-person button{background:transparent;border:0;padding:0;text-align:left;color:#264667;font-size:12px;font-weight:800;cursor:pointer}
.hm-person button:hover{text-decoration:underline}
.hm-person small{font-size:10px;color:#7b8fa5}
.hm-person input{accent-color:#257cc9;margin:0 5px 0 0;vertical-align:middle}
.hm-cell{min-height:73px;padding:8px 3px 7px;border-radius:7px;border:2px solid transparent;background:var(--hm-bg);color:var(--hm-color);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;text-align:center;transition:transform .12s,border-color .12s;position:relative}
.hm-cell:hover{border-color:#19599f;transform:translateY(-1px)}.hm-cell.chosen{border-color:#073d80;box-shadow:0 0 0 2px #89b8ec}
.hm-score{font-size:16px;line-height:1;font-weight:850;font-variant-numeric:tabular-nums}
.hm-small{font-size:9px;font-weight:650;opacity:.95;white-space:nowrap}
.hm-delta{font-size:10px;font-weight:850;border-radius:5px;background:var(--hm-pill);padding:3px 5px;white-space:nowrap;line-height:1}
.hm-coverage{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#2c5985;text-align:center}
.hm-coverage span{font-size:10px;color:#778da4;font-weight:500}
.hm-legend{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:12px}
.hm-swatches{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11px;color:#67829d}
.hm-swatch{width:28px;height:13px;border-radius:3px}
.hm-legend-note{font-size:11px;color:#6b8099}
.hm-details{border:1px solid #cfdfef;border-radius:13px;overflow:hidden;background:#fff;position:sticky;top:18px;box-shadow:0 2px 8px #183a6712}
.hm-detail-head{background:linear-gradient(135deg,#e9f4ff,#f8fcff);border-bottom:1px solid #dbe8f6;padding:16px}
.hm-detail-head .minor{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:#397aad;font-weight:850}
.hm-detail-head h3{font-size:17px;margin:7px 0 4px;line-height:1.35;color:#173653}
.hm-detail-head p{font-size:12px;color:#6584a4;line-height:1.45;margin:0}
.hm-detail-body{padding:15px;display:grid;gap:13px;max-height:760px;overflow-y:auto}
.hm-scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.hm-scorebox{border:1px solid #dce8f7;border-radius:9px;background:#f7fbff;padding:10px 8px;min-width:0}
.hm-scorebox .label{color:#6282a4;font-size:10px}.hm-scorebox .big{font-size:20px;font-weight:850;margin-top:4px;color:#1e5897;font-variant-numeric:tabular-nums}
.hm-status{border:1px solid #bad7f4;background:#ebf5ff;color:#245d99;border-radius:8px;padding:9px 11px;font-size:12px;font-weight:750;line-height:1.5}
.hm-detail-section{display:grid;gap:6px}
.hm-detail-title{font-size:11px;letter-spacing:.35px;text-transform:uppercase;font-weight:850;color:#456788}
.hm-detail-text{font-size:12px;color:#5c718b;line-height:1.65}
.hm-source{border-left:3px solid #84b4e7;padding:9px 10px;background:#f2f8ff;border-radius:0 8px 8px 0;font-size:11.5px;color:#5a728e;line-height:1.5}
.hm-source strong{display:block;color:#285786;margin-bottom:4px}
.hm-policy{color:#7089a1;font-size:11px;line-height:1.6;border-top:1px solid #e7edf5;padding-top:11px}
.hm-footer{font-size:11px;line-height:1.65;color:#71849c;border-top:1px solid #e8eff7;margin-top:18px;padding-top:13px}
.hm-compare{border:1px solid #d3e3f2;border-radius:12px;background:#f8fbff;padding:15px;margin-top:16px}
.hm-compare strong{font-size:13px;color:#315779}
.hm-comparetable{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.hm-comparetable th,.hm-comparetable td{padding:9px 8px;text-align:left;border-bottom:1px solid #e1eaf4}.hm-comparetable th{color:#496a8a}
.hm-muted{color:#8091a4;font-size:12px}.hm-help{border-radius:10px;background:#eff7ff;padding:12px;color:#57738f;line-height:1.6;font-size:11px;margin-top:12px}
@media(max-width:1320px){.hm-layout{grid-template-columns:1fr}.hm-details{position:static}.hm-grid{min-width:950px}}
@media(max-width:720px){.hm-overview{grid-template-columns:repeat(2,minmax(0,1fr))}.hm-panel{padding:14px}.hm-heading{font-size:19px}.hm-toolbar{align-items:stretch}.hm-control{flex:1}.hm-control select{min-width:100%}}
</style>

<script>
const ico={chart:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 19V5m0 14h18M7 15l4-5 4 3 5-7"/></svg>',list:'<svg class="icon" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></svg>',info:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 11v6m0-10h.01"/></svg>',doc:'<svg class="icon" viewBox="0 0 24 24"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 13h8m-8 4h8"/></svg>',arrow:'<svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>',close:'<svg class="icon" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>'};
const people=[
{id:'arjun',name:'Arjun Mehta',pre:92,tech:2.8,assignment:4.2,behavior:4.0,exp:'5.5',skill:'Backend services and Java — strong resume coverage',gap:'Distributed architecture — interview evidence did not fully corroborate claimed depth',supported:['Implemented working solution with solid test coverage in assignment','Demonstrated ownership and clear stakeholder communication'],concern:['Struggled to explain partition tolerance and service recovery during system design','Critical distributed-system competency remains below the SDE-2 role benchmark'],source:'Technical interview: system-design rubric, Q3–Q5; assignment review: test suite and code-review notes',note:'Discuss targeted system-design evidence before deciding whether an additional round is warranted.'},
{id:'roshan',name:'Roshan Kapoor',pre:74,tech:4.6,assignment:4.5,behavior:4.3,exp:'4.3',skill:'General backend engineering — relevant but less exact resume keywords',gap:'Distributed systems title not explicitly stated in employment history',supported:['Designed a fault-tolerant service with clear trade-off analysis','Produced maintainable code and strong automated tests','Communicated technical decisions concisely'],concern:['Resume matching may have underweighted transferable experience'],source:'Technical interview: architecture evidence Q1–Q4; assignment review: design notes and test outcomes',note:'Review alongside other finalists; investigate whether resume screening underweighted transferable competencies.'},
{id:'gajender',name:'Gajender Singh',pre:87,tech:4.3,assignment:4.4,behavior:4.1,exp:'5',skill:'Microservices, API design and distributed systems — direct evidence in CV',gap:'Production incident ownership — limited detail on CV',supported:['System-design decisions aligned with required scale','Assignment validated maintainability and testing','Behavioural interview supported ownership'],concern:['Incident leadership under severe operational pressure not independently established'],source:'Technical interview: design scorecard; assignment: code-review rubric; behavioural: incident question',note:'Compare demonstrated experience with the requirements for the final SDE-2 role.'},
{id:'mohan',name:'Mohan Tyagi',pre:65,tech:2.7,assignment:3.0,behavior:3.1,exp:'3.4',skill:'Core Java and API work — moderate evidence',gap:'Systems scale and testing depth — limited documented evidence',supported:['Completed core functionality of the assignment','Demonstrated willingness to revise a solution'],concern:['System design and test strategy fell below the configured benchmark','Engineering ownership examples lacked evidence of direct accountability'],source:'Technical interview: fundamentals rubric; assignment: coverage and review notes',note:'Review documented gaps against mandatory job requirements.'},
{id:'aditi',name:'Aditi Rao',pre:79,tech:4.4,assignment:4.2,behavior:4.5,exp:'4.8',skill:'Platform engineering, cloud infrastructure — broadly relevant',gap:'Few exact technology matches for the stated stack',supported:['Strong architecture reasoning and clear service boundaries','Strong cross-functional communication','Assignment met reliability and maintainability expectations'],concern:['Some stack-specific experience remains untested'],source:'Technical interview: service-design rubric; assignment: performance and code review',note:'Consider whether stack-specific learning can be evaluated during onboarding or by targeted questions.'},
{id:'ritika',name:'Ritika Bose',pre:58,tech:4.5,assignment:4.3,behavior:4.2,exp:'5.1',skill:'Open-source contributions and platform work — strong applied evidence',gap:'Resume does not use several keywords present in the JD',supported:['Strong practical understanding of distributed failures','Assignment demonstrated clean architecture and testing'],concern:['One role-specific framework was not demonstrated'],source:'Technical interview: failure recovery Q2; assignment: reviewer rubric',note:'Review the original screening weights and role-specific framework requirement.'},
{id:'zaid',name:'Zaid Thomas',pre:89,tech:3.1,assignment:3.5,behavior:3.7,exp:'5.8',skill:'Distributed programming and Linux — extensive resume claims',gap:'Depth of trade-off analysis — uncertain',supported:['Solid coding fundamentals','Clear documentation in assignment'],concern:['Distributed-systems depth was weaker than suggested by resume','Incomplete evidence of architecture trade-offs'],source:'Technical interview: architecture Q2–Q4; assignment: written design rationale',note:'Review architecture evidence before advancing to a decision.'},
{id:'yash',name:'Yash Agarwal',pre:70,tech:3.5,assignment:3.4,behavior:3.6,exp:'4.0',skill:'Application development and cloud services — relevant',gap:'Testing strategy and reliability engineering — thin evidence',supported:['Functional implementation of the assignment','Collaborative approach to feedback'],concern:['Reliability and observability competencies were only partially demonstrated'],source:'Assignment: testing rubric; technical interview: reliability Q4',note:'Check whether the unestablished reliability skill is mandatory for this vacancy.'}
].map(p=>({...p,performance:Math.round((p.tech*.5+p.assignment*.35+p.behavior*.15)*20)}));
const ongoing=[{name:'Zaid Thomas',exp:'2 years',desc:'Distributed systems and systems programming — strong coverage',gap:'Linux systems — no direct evidence present',stage:'TECHNICAL APTITUDE TEST EVALUATED',status:'Good'},{name:'Yash Agarwal',exp:'0.7 years',desc:'Distributed systems engineering — strong advanced capability demonstrated',gap:'Software testing and quality — no direct evidence present',stage:'BEHAVIORAL AND CULTURE FIT INTERVIEW SCHEDULED',status:'Good'},{name:'Ritika Bose',exp:'0.6 years',desc:'Distributed systems engineering — strong evidence of core capability',gap:'Linux systems — no direct evidence of required capability',stage:'BEHAVIORAL AND CULTURE FIT INTERVIEW SCHEDULED',status:'Good'}];
const state={stage:'concluded',view:'list',quadrant:'all',round:'overall',search:'',sort:'name',selected:null};
function toast(msg){document.getElementById('toast').innerHTML='<div class="toast">'+msg+'</div>';clearTimeout(window._toast);window._toast=setTimeout(()=>document.getElementById('toast').innerHTML='',3500)}
function h(s){return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function score(p){return state.round==='technical'?Math.round(p.tech*20):state.round==='assignment'?Math.round(p.assignment*20):state.round==='behavior'?Math.round(p.behavior*20):p.performance}
function quad(p){const highX=p.pre>=80,highY=score(p)>=75;return highX?(highY?'strong':'review'):(highY?'surprise':'limited')}
const qNames={all:'All completed',strong:'Strong validation',surprise:'Positive surprise',review:'Needs review',limited:'Limited validation'};
const qColors={strong:'#16a47d',surprise:'#2c8ee9',review:'#d88731',limited:'#8795a9'};
function filtered(){let a=people.filter(p=>(state.quadrant==='all'||quad(p)===state.quadrant)&&p.name.toLowerCase().includes(state.search.toLowerCase()));if(state.sort==='pre')a.sort((x,y)=>y.pre-x.pre);else if(state.sort==='post')a.sort((x,y)=>score(y)-score(x));else a.sort((x,y)=>x.name.localeCompare(y.name));return a}
function renderTabs(){const arr=[['total','100','Total Applications'],['ongoing','70','Ongoing'],['concluded','26','Evaluation Plan Concluded'],['hold','0','On Hold'],['offer','1','In Offer'],['selected','3','Selected']];document.getElementById('tabs').innerHTML=arr.map(([id,count,label],i)=>`${i?'<span class="dividerline"></span>':''}<button class="tab ${state.stage===id?'active':''}" data-stage="${id}" title="${label}"><small>${count}</small> ${label}</button>`).join('')}
function renderOngoing(){let a=ongoing.filter(p=>p.name.toLowerCase().includes(state.search.toLowerCase()));return `<div class="sectionhead"><div><h2 class="secttitle">Ongoing candidates</h2><div class="secsubtitle">Candidates currently completing their evaluation plans.</div></div></div><div class="candidate-list">${a.map(p=>`<article class="candidatecard"><div class="identity"><div class="avatar">${p.name.split(' ').map(x=>x[0]).join('')}</div><div><div class="personname">${h(p.name)}</div><div class="identityline">${h(p.exp)} of experience</div><div class="identityline">Applied: 3 weeks ago</div><div class="identityline">Job: Software Engineer - Distributed Syst...</div></div></div><div class="bullets"><div class="bullet"><span class="dot green"></span>${h(p.desc)}</div><div class="bullet"><span class="dot red"></span>${h(p.gap)}</div><div class="bullet"><span class="dot red"></span>Software testing — additional evidence pending</div></div><div class="rightcard"><div class="status">${h(p.stage)}</div><div class="fitlabel">${h(p.status)}</div><div class="cardactions"><button class="circlebtn" data-view-ongoing="${h(p.name)}" title="View candidate details">${ico.doc}</button><button class="circlebtn" data-view-ongoing="${h(p.name)}" title="View evaluation plan">${ico.chart}</button></div></div></article>`).join('')}</div>`}
function card(p){const group=quad(p);return `<article class="candidatecard"><div class="identity"><div class="avatar">${p.name.split(' ').map(x=>x[0]).join('')}</div><div style="min-width:0"><div class="personname">${h(p.name)}</div><div class="identityline">${h(p.exp)} years experience</div><div class="identityline">Evaluation plan: 3 of 3 rounds complete</div><div class="identityline">Job: Software Engineer - Distributed Syst...</div></div></div><div class="bullets"><div class="bullet"><span class="dot green"></span>${h(p.skill)}</div><div class="bullet"><span class="dot red"></span>${h(p.gap)}</div><div class="bullet"><span class="dot" style="background:${qColors[group]}"></span>${qNames[group]} · Resume ${p.pre}% · Evaluated ${score(p)}%</div></div><div class="rightcard"><div class="status">EVALUATION PLAN CONCLUDED</div><span class="roundpill">3 / 3 rounds completed</span><div class="cardactions"><button class="circlebtn" data-open-person="${p.id}" title="Open validation evidence">${ico.doc}</button><button class="circlebtn" data-open-person="${p.id}" title="Locate on Validation Matrix">${ico.chart}</button></div></div></article>`}
function renderConcluded(){if(state.view==='list'){return `<div class="sectionhead"><div><div class="kicker">Evaluation complete</div><h2 class="secttitle">Evaluation Plan Concluded <span class="countside">26 candidates</span></h2><div class="secsubtitle">Showing 8 sample profiles of 26 concluded plans. Compare demonstrated performance against original resume fit.</div></div><div class="sectionright"><button class="matrixbtn" id="viewmatrix">${ico.chart} View Validation Matrix ${ico.arrow}</button></div></div><div class="subtleinfo">${ico.info}<span>Completed evaluation plans are not the same as final hiring decisions. Candidates in Offer or Selected can also appear here. Only candidates with a comparable, completed evaluation plan are plotted together.</span></div><div class="candidate-list">${filtered().length?filtered().map(card).join(''):'<div class="nocontent">No matching completed candidates in the illustrative dataset.</div>'}</div>`}
return `<div class="sectionhead"><div><div class="kicker">Candidate intelligence</div><h2 class="secttitle">Resume Fit vs Demonstrated Interview Performance</h2><div class="secsubtitle">Select a candidate dot to inspect the evidence behind their validation position.</div></div><div class="sectionright"><button class="secondary" id="backtolist">${ico.list} Candidate List</button></div></div><section class="plotpanel"><div class="plottop"><div><div class="plot-title">Validation Matrix <span class="countside">8 illustrative candidates</span></div><div class="plotdesc">SDE-2 · Technical evaluation + Assignment + Behavioural & culture-fit interview</div></div></div><div class="activefilters" id="chips">${Object.keys(qNames).map(q=>`<button class="filterchip ${state.quadrant===q?'active':''}" data-q="${q}">${qNames[q]}</button>`).join('')}<label class="fieldlabel" for="roundsel">Compare by</label><select id="roundsel" class="roundselect"><option value="overall" ${state.round==='overall'?'selected':''}>All rounds (weighted)</option><option value="technical" ${state.round==='technical'?'selected':''}>Technical interview</option><option value="assignment" ${state.round==='assignment'?'selected':''}>Assignment</option><option value="behavior" ${state.round==='behavior'?'selected':''}>Behavioural assessment</option></select></div><div class="matrixlayout"><div class="chartbox"><div id="scatter"></div><div class="charthint">Select a plotted candidate to open the evidence drawer →</div></div><div class="evidence" id="evidence"></div></div><div class="chartfoot">Illustrative role-specific thresholds: 80% resume fit, 75% demonstrated competency. The two axes measure different things; their scores should not be subtracted or treated as a change in one metric. Overall performance uses demonstrative weights (50% technical, 35% assignment, 15% behavioural). A recruiter-approved rubric, evidence citations and mandatory competency rules are needed in production.</div></section><div class="sectionhead" style="margin-top:23px"><div><h2 class="secttitle">Evaluated candidates</h2><div class="secsubtitle">Select a row to inspect its evidence in the matrix above.</div></div></div><div class="grid-table"><div class="grid-head"><span>Candidate</span><span>Resume fit</span><span>Evaluated</span><span>Classification</span></div>${filtered().map(p=>`<div class="grid-data"><button data-select="${p.id}">${h(p.name)}</button><span>${p.pre}%</span><span>${score(p)}%</span><span><span class="mini-pill" style="color:${qColors[quad(p)]}">${qNames[quad(p)]}</span></span></div>`).join('')}</div><section id="completed-heatmap" class="hm-panel" aria-label="Post-evaluation competency heatmap"><div id="heatmap-root"></div></section>`}
function plot(){const arr=filtered();let W=870,H=500,L=75,R=835,T=50,B=425;const xp=v=>L+(v-40)/60*(R-L),yp=v=>B-(v-40)/60*(B-T);const tx=xp(80),ty=yp(75);const label=state.round==='overall'?'Demonstrated competency index (%)':state.round==='technical'?'Technical interview score (%)':state.round==='assignment'?'Assignment score (%)':'Behavioural assessment score (%)';let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Interactive scatterplot comparing resume match with demonstrated evaluation performance. Select a candidate dot to see evidence."><rect x="${L}" y="${T}" width="${tx-L}" height="${ty-T}" fill="#f0f7ff"/><rect x="${tx}" y="${T}" width="${R-tx}" height="${ty-T}" fill="#e8f8f1"/><rect x="${L}" y="${ty}" width="${tx-L}" height="${B-ty}" fill="#f3f6fa"/><rect x="${tx}" y="${ty}" width="${R-tx}" height="${B-ty}" fill="#fff6ea"/>`;
for(let t=40;t<=100;t+=10){svg+=`<line x1="${xp(t)}" y1="${T}" x2="${xp(t)}" y2="${B}" stroke="#dbe4ed" stroke-width="1"/><line x1="${L}" y1="${yp(t)}" x2="${R}" y2="${yp(t)}" stroke="#dbe4ed" stroke-width="1"/><text x="${xp(t)}" y="${B+23}" text-anchor="middle" fill="#8191a5" font-size="13">${t}</text><text x="${L-16}" y="${yp(t)+4}" text-anchor="end" fill="#8191a5" font-size="13">${t}</text>`}
svg+=`<line x1="${tx}" y1="${T}" x2="${tx}" y2="${B}" stroke="#95a9bf" stroke-dasharray="5 5" stroke-width="2"/><line x1="${L}" y1="${ty}" x2="${R}" y2="${ty}" stroke="#95a9bf" stroke-dasharray="5 5" stroke-width="2"/><text x="${(L+tx)/2}" y="${T+22}" text-anchor="middle" font-size="14" font-weight="700" fill="#3574ae">POSITIVE SURPRISE</text><text x="${(tx+R)/2}" y="${T+22}" text-anchor="middle" font-size="14" font-weight="700" fill="#17835e">STRONG VALIDATION</text><text x="${(L+tx)/2}" y="${B-17}" text-anchor="middle" font-size="14" font-weight="700" fill="#8b98a9">LIMITED VALIDATION</text><text x="${(tx+R)/2}" y="${B-17}" text-anchor="middle" font-size="14" font-weight="700" fill="#b7792a">NEEDS REVIEW</text><text x="${(L+R)/2}" y="${H-9}" font-size="14" font-weight="600" text-anchor="middle" fill="#53657c">Original resume / JD fit (%) →</text><text transform="translate(20 ${(T+B)/2}) rotate(-90)" font-size="14" font-weight="600" text-anchor="middle" fill="#53657c">${label} →</text>`;
for(const p of arr){const x=xp(p.pre),y=yp(score(p)),active=state.selected===p.id;const isRight=p.pre>85;const offsetY={aditi:-10,gajender:15,arjun:-7,zaid:17,roshan:-6}[p.id]||4;svg+=`<g data-dot="${p.id}" tabindex="0" role="button" aria-label="${h(p.name)}, ${p.pre} percent resume fit, ${score(p)} percent evaluated performance" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${active?14:11}" fill="${qColors[quad(p)]}" stroke="white" stroke-width="3"/><circle cx="${x}" cy="${y}" r="18" fill="transparent"/><text x="${x+(isRight?-18:18)}" y="${y+offsetY}" text-anchor="${isRight?'end':'start'}" font-size="14" fill="#283c56" font-weight="${active?'800':'650'}" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">${h(p.name.split(' ')[0])}</text><title>${h(p.name)} · Resume ${p.pre}% · Evaluated ${score(p)}% · ${qNames[quad(p)]}</title></g>`}
svg+='</svg>';document.getElementById('scatter').innerHTML=svg;document.querySelectorAll('[data-dot]').forEach(n=>{n.addEventListener('click',()=>selectCandidate(n.dataset.dot));n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectCandidate(n.dataset.dot)}})})}
function renderEvidence(){const el=document.getElementById('evidence');if(!el)return;const p=people.find(p=>p.id===state.selected);if(!p){el.innerHTML=`<div class="evhead"><div><strong>Candidate Evidence Drawer</strong><div class="evsubtitle">Contextual, competency-linked explanations</div></div></div><div class="evempty"><div><svg viewBox="0 0 64 64"><circle cx="27" cy="27" r="17"/><path d="m40 40 17 17M27 17v20M17 27h20"/></svg><p><strong>Select any candidate dot</strong></p><p>Technical, assignment and behavioural evidence will appear here with the reasoning behind the candidate's position.</p></div></div>`;return}
el.innerHTML=`<div class="evhead"><div><strong>Evidence & Validation</strong><div class="evsubtitle">${qNames[quad(p)]} · All 3 rounds complete</div></div><button class="close" id="closeev" aria-label="Close candidate evidence">✕</button></div><div class="evbody"><div><div class="evname">${h(p.name)}</div><div class="evsummary" style="margin-top:4px">Resume match <strong>${p.pre}%</strong> · Evaluated ${score(p)}%<br>Evidence differs by competency, not simply by the overall score.</div></div><div class="roundgrid"><div class="score"><div class="lab">Technical</div><div class="num">${p.tech.toFixed(1)}/5</div></div><div class="score"><div class="lab">Assignment</div><div class="num">${p.assignment.toFixed(1)}/5</div></div><div class="score"><div class="lab">Behavioural</div><div class="num">${p.behavior.toFixed(1)}/5</div></div></div><div class="evidencegroup"><div class="evtitle">SUPPORTED BY EVIDENCE</div>${p.supported.map(x=>`<div class="evline"><span class="dot green"></span><span>${h(x)}</span></div>`).join('')}</div><div class="evidencegroup"><div class="evtitle">CONTRADICTIONS / NOT ESTABLISHED</div>${p.concern.map(x=>`<div class="evline"><span class="dot red"></span><span>${h(x)}</span></div>`).join('')}</div><div class="evbox"><div class="evtitle">EVIDENCE SOURCES</div><div class="source">${h(p.source)}</div></div><div class="recruiter-note"><strong>For recruiter review:</strong> ${h(p.note)}<br><span style="font-size:11px">Human reviewers make all advancement and hiring decisions.</span></div><button class="smalllink" id="viewrounds">View round-by-round details →</button><div id="rounddetails" hidden class="evbox"><div class="evtitle">ROUND-LEVEL EVALUATION EVIDENCE</div><div class="evline">Technical interview: ${p.tech.toFixed(1)}/5 · Job-related architecture and coding rubric.</div><div class="evline">Assignment: ${p.assignment.toFixed(1)}/5 · Deliverable quality and testing rubric.</div><div class="evline">Behavioural interview: ${p.behavior.toFixed(1)}/5 · Documented examples of job-relevant working behaviours.</div></div></div>`;
document.getElementById('closeev').onclick=()=>{state.selected=null;plot();renderEvidence()};document.getElementById('viewrounds').onclick=()=>{const d=document.getElementById('rounddetails');d.hidden=!d.hidden;document.getElementById('viewrounds').textContent=d.hidden?'View round-by-round details →':'Hide round-by-round details ↑'} }
function render(){renderTabs();const w=document.getElementById('workspace');if(state.stage==='ongoing')w.innerHTML=renderOngoing();else if(state.stage==='concluded')w.innerHTML=renderConcluded();else if(state.stage==='total'){w.innerHTML=`<div class="sectionhead"><div><h2 class="secttitle">All Applications</h2><div class="secsubtitle">This design focuses on the completed evaluation workflow. Select Evaluation Plan Concluded to view the comparison feature.</div></div></div><div class="candidate-list">${people.slice(0,5).map(card).join('')}</div>`}else{let labels={hold:'On Hold',offer:'In Offer',selected:'Selected'};w.innerHTML=`<div class="sectionhead"><div><h2 class="secttitle">${labels[state.stage]}</h2><div class="secsubtitle">Hiring outcomes are separate from evaluation-plan completion.</div></div></div>${state.stage==='hold'?'<div class="nocontent">No candidates currently on hold.</div>':`<div class="candidate-list">${people.slice(0,state.stage==='offer'?1:3).map(card).join('')}</div>`}`}
if(state.stage==='concluded'&&state.view==='matrix'){plot();renderEvidence();renderHeatmap();document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{state.quadrant=b.dataset.q;if(state.selected&&!filtered().some(p=>p.id===state.selected))state.selected=null;render()});document.getElementById('roundsel').onchange=e=>{state.round=e.target.value;if(state.selected&&!filtered().some(p=>p.id===state.selected))state.selected=null;render()}} }
function selectCandidate(id){state.stage='concluded';state.view='matrix';if(!filtered().some(p=>p.id===id))state.quadrant='all';state.selected=id;render();document.querySelector('.sectionhead').scrollIntoView({behavior:'smooth',block:'start'})}

const hmDelta=(a,b)=>a==null||b==null?null:Math.round((b-a)*10)/10;
function hmShade(v,mode){if(v===null)return {bg:'#f1f4f8',fg:'#72869e',pill:'#e6ebf0'};let colors=['#edf6ff','#dbeeff','#b8dcfa','#87bdf0','#458dd4','#195da9'];let scaled=mode==='gap'?Math.min(5,v*2.4):v;let ix=scaled<2?0:scaled<2.8?1:scaled<3.5?2:scaled<4?3:scaled<4.5?4:5;return {bg:colors[ix],fg:ix>=4?'#fff':'#123c67',pill:ix>=4?'#ffffff30':'#ffffffa6'} }
function hmStatus(id,i){const r=hmRows[id],s=hmSkills[i],o=r.observed[i],cv=r.claim[i];if(o===null)return 'Not assessed';if(s.mandatory&&o<s.threshold)return 'Below mandatory benchmark';let delta=hmDelta(cv,o);if(delta<=-.8)return 'Résumé claim not corroborated';if(delta>=.8)return 'Stronger than résumé indicated';return 'Broadly corroborated'}
function hmRowsShown(){let rows=people.filter(p=>p.name.toLowerCase().includes(hmState.query.toLowerCase()));rows=rows.filter(p=>{const r=hmRows[p.id];if(!r)return false;const active=hmSkills.map((s,i)=>({s,i})).filter(x=>hmState.group==='all'||x.s.group===hmState.group);if(hmState.filter==='large-gaps')return active.some(({i})=>hmDelta(r.claim[i],r.observed[i])<=-.8);if(hmState.filter==='above')return active.some(({i})=>hmDelta(r.claim[i],r.observed[i])>=.8);if(hmState.filter==='mandatory')return active.some(({s,i})=>s.mandatory&&r.observed[i]!==null&&r.observed[i]<s.threshold);return true});
 rows.sort((a,b)=>{const ra=hmRows[a.id],rb=hmRows[b.id];if(hmState.sort==='gap'){const f=r=>r.claim.reduce((z,c,i)=>z+Math.max(0,c-(r.observed[i]??c)),0);return f(rb)-f(ra)}if(hmState.sort==='coverage'){return hmCoverage(b.id).met-hmCoverage(a.id).met}if(hmState.sort==='observed'){const avg=r=>r.observed.filter(v=>v!==null).reduce((x,y)=>x+y,0)/r.observed.filter(v=>v!==null).length;return avg(rb)-avg(ra)}return a.name.localeCompare(b.name)});

function hmDetail(){const id=hmState.person,skill=hmSkills.find(x=>x.id===hmState.skill),i=hmSkills.indexOf(skill),p=people.find(x=>x.id===id),r=hmRows[id];if(!p||!r)return '';const cv=r.claim[i],ob=r.observed[i],d=hmDelta(cv,ob),status=hmStatus(id,i);const notes=hmSpecific[id+'.'+skill.id]||{};
 const claimText=notes.claimed||`The résumé and listed projects indicated approximately ${hmNum(cv)}/5 proficiency in ${skill.name.toLowerCase()} under the SDE-2 rubric. This was a pre-evaluation inference, not a verified skill measure.`;

function hmCSV(){const out=[['Candidate','Competency','Mandatory','Benchmark','Resume indicated (0-5)','Post evaluation (0-5)','Evaluated minus resume','Evidence status']];for(const p of hmRowsShown()){const r=hmRows[p.id];hmSkills.forEach((s,i)=>{let d=hmDelta(r.claim[i],r.observed[i]);out.push([p.name,s.name,s.mandatory?'Yes':'No',s.threshold,r.claim[i],r.observed[i]??'',d??'',hmStatus(p.id,i)])})};const csv=out.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download='treadspace_post_evaluation_claims_vs_skills_demo.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),1500)}

function renderHeatmap(){const root=document.getElementById('heatmap-root');if(!root)return;const rows=hmRowsShown();let skills=hmSkills;const inspected=hmSkills.map((s,i)=>({s,i}));const largeGaps=people.filter(p=>hmRows[p.id].claim.some((cv,i)=>hmDelta(cv,hmRows[p.id].observed[i])<=-.8)).length;
 const selectedSkills=inspected.filter(({s})=>hmState.group==='all'||s.group===hmState.group);
 // Preserve column alignment while filtering categories by disabling inactive columns visually.

 <div class="hm-toolbar"><div class="hm-control"><label for="hm-view">Cell colour represents</label><select id="hm-view"><option value="observed" ${hmState.mode==='observed'?'selected':''}>Demonstrated proficiency</option><option value="claim" ${hmState.mode==='claim'?'selected':''}>Résumé indication</option><option value="gap" ${hmState.mode==='gap'?'selected':''}>Absolute claim–evidence gap</option></select></div><div class="hm-control"><label for="hm-group">Competency category</label><select id="hm-group"><option value="all" ${hmState.group==='all'?'selected':''}>All competencies</option><option value="technical" ${hmState.group==='technical'?'selected':''}>Engineering competencies</option><option value="behavior" ${hmState.group==='behavior'?'selected':''}>Job-relevant behaviours</option></select></div><div class="hm-control"><label for="hm-sort">Sort candidates</label><select id="hm-sort"><option value="name" ${hmState.sort==='name'?'selected':''}>Name A–Z</option><option value="gap" ${hmState.sort==='gap'?'selected':''}>Largest claim gaps</option><option value="coverage" ${hmState.sort==='coverage'?'selected':''}>Mandatory coverage</option><option value="observed" ${hmState.sort==='observed'?'selected':''}>Highest demonstrated rating</option></select></div><div class="hm-control hm-search"><label for="hm-search">Find candidate</label><input id="hm-search" placeholder="Search completed candidates" value="${h(hmState.query)}" /></div><button id="hm-compare" class="hm-btn ${hmState.compare?'primary':''}">Compare selected (${hmState.checked.length})</button></div>
 <div class="hm-filterrow">${[['all','All completed'],['large-gaps','Claim gaps ≥ 0.8'],['above','Strong positive surprises'],['mandatory','Below mandatory threshold']].map(([id,label])=>`<button class="hm-filter ${hmState.filter===id?'on':''}" data-hm-filter="${id}">${label}</button>`).join('')}<span class="hm-filter-note">${rows.length} of 8 demo candidates visible</span></div>

 <div class="hm-legend"><div class="hm-swatches"><strong style="margin-right:3px">${hmState.mode==='gap'?'Gap magnitude':'Proficiency scale'}</strong>${['#edf6ff','#dbeeff','#b8dcfa','#87bdf0','#458dd4','#195da9'].map((cl,i)=>`<span class="hm-swatch" style="background:${cl}"></span>`).join('')}<span>${hmState.mode==='gap'?'smaller → larger gap':'lower → higher proficiency'}</span></div><span class="hm-legend-note">Gray = not assessed · ▼ negative gap · ▲ positive surprise</span></div><div class="hm-help"><strong>How to read:</strong> <strong>Eval</strong> = post-evaluation demonstrated rating; <strong>CV</strong> = pre-interview résumé indication. The value after the arrow describes whether evaluation evidence is above, below or broadly aligned with the résumé indication. Select any blue cell for the evidence trail. A completed evaluation plan does not guarantee evidence for every competency.</div></div><aside class="hm-details" id="hm-details" aria-live="polite">${hmDetail()}</aside></div>
 ${hmState.compare?hmComparison():''}<div class="hm-footer">Illustrative demo only, not real Treadspace applicant data. 0–5 scales are competency-specific; résumé indications are inferences, not verified self-claims. Post-evaluation scores must come from an approved rubric with traceable assessment evidence; never infer unassessed skills as zero. The heatmap cannot establish a person's absolute ability or determine a hiring outcome.</div>`;
 root.querySelectorAll('[data-hm-filter]').forEach(el=>el.onclick=()=>{hmState.filter=el.dataset.hmFilter;renderHeatmap()});root.querySelectorAll('[data-hm-person]').forEach(el=>el.onclick=()=>{hmState.person=el.dataset.hmPerson;hmState.skill=el.dataset.hmSkill;renderHeatmap()});root.querySelectorAll('[data-hm-row]').forEach(el=>el.onclick=()=>{hmState.person=el.dataset.hmRow;hmState.skill='system';renderHeatmap()});root.querySelectorAll('[data-hm-check]').forEach(el=>el.onchange=()=>{hmState.checked=el.checked?[...new Set([...hmState.checked,el.dataset.hmCheck])]:hmState.checked.filter(v=>v!==el.dataset.hmCheck);renderHeatmap()});
